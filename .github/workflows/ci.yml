name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TrackMatch.sln

      - name: Build
        run: dotnet build TrackMatch.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution TrackMatch.sln --configuration Release --no-build
