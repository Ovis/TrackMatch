name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore TrackMatch.slnx

      - name: Verify C# formatting
        run: dotnet format TrackMatch.slnx --no-restore --verify-no-changes

      - name: Verify XAML formatting
        run: dotnet xstyler -c Settings.XamlStyler -r -d ./src --passive

      - name: Build
        run: dotnet build TrackMatch.slnx --configuration Release --no-restore

      # 1つのdotnet testに全プロジェクトを渡すと、テストホストが停止した場合に
      # どのプロジェクトで詰まったか判別できない。プロジェクト単位でタイムアウトを設け、
      # TRXと詳細ログを常に残してハング箇所を特定できるようにする。
      - name: Test Core
        timeout-minutes: 10
        run: dotnet test --project tests/TrackMatch.Core.Tests/TrackMatch.Core.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=core.trx"

      - name: Test Infrastructure
        timeout-minutes: 15
        run: dotnet test --project tests/TrackMatch.Infrastructure.Tests/TrackMatch.Infrastructure.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=infrastructure.trx"

      - name: Test App
        timeout-minutes: 10
        run: dotnet test --project tests/TrackMatch.App.Tests/TrackMatch.App.Tests.csproj --configuration Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=app.trx"
