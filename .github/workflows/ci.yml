name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore TrackMatch.slnx

      - name: Verify C# formatting
        run: dotnet format TrackMatch.slnx --no-restore --verify-no-changes

      - name: Verify XAML formatting
        run: dotnet xstyler -c Settings.XamlStyler -r -d ./src --passive

      - name: Build
        run: dotnet build TrackMatch.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution TrackMatch.slnx --configuration Release --no-build
