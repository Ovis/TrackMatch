name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CHROMAPRINT_VERSION: '1.6.1'
  CHROMAPRINT_SHA256: '735d6182b38e9f364b84ce6f4ccd682c75e2851de89735711d6b762d12b92a4e'
  FFMPEG_VERSION: '8.0'
  FFMPEG_BUILD_TAG: 'v8.0-1'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TrackMatch.sln

      - name: Test
        run: dotnet test --solution TrackMatch.sln --configuration Release

      - name: Publish Windows x64
        shell: pwsh
        run: |
          # GUIとScannerは共通DLLと同梱fpcalcを利用するため、同じ配布ディレクトリへまとめる。
          dotnet publish src/TrackMatch.App/TrackMatch.App.csproj -c Release -r win-x64 --self-contained false -o artifacts/package
          dotnet publish src/TrackMatch.Scanner/TrackMatch.Scanner.csproj -c Release -r win-x64 --self-contained false -o artifacts/package
          Copy-Item THIRD_PARTY_NOTICES.md artifacts/package/THIRD_PARTY_NOTICES.md

      - name: Download and verify Chromaprint fpcalc
        shell: pwsh
        run: |
          $version = $env:CHROMAPRINT_VERSION
          $archive = "artifacts/chromaprint-fpcalc.zip"
          $url = "https://github.com/acoustid/chromaprint/releases/download/v$version/chromaprint-fpcalc-$version-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile $archive

          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:CHROMAPRINT_SHA256) {
            throw "Chromaprint archive SHA-256 mismatch. Expected $env:CHROMAPRINT_SHA256, actual $actual"
          }

          Expand-Archive $archive -DestinationPath artifacts/chromaprint -Force
          $fpcalc = Get-ChildItem artifacts/chromaprint -Filter fpcalc.exe -Recurse | Select-Object -First 1
          if (-not $fpcalc) {
            throw 'fpcalc.exe was not found in the Chromaprint archive.'
          }

          # GUI/Scanner双方のAppContext.BaseDirectoryからfpcalc/fpcalc.exeとして解決できる共通配置にする。
          $sourceDir = $fpcalc.Directory.FullName
          $destination = "artifacts/package/fpcalc"
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          Copy-Item "$sourceDir/*" $destination -Recurse -Force

          # 上流のライセンス案内だけではLGPL本文を含まないため、対応するFFmpeg 8.0タグから全文も収録する。
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/acoustid/chromaprint/v$version/LICENSE.md" -OutFile "$destination/LICENSE.md"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/FFmpeg/FFmpeg/n$env:FFMPEG_VERSION/COPYING.LGPLv2.1" -OutFile "$destination/LGPL-2.1.txt"

      - name: Download corresponding LGPL sources
        shell: pwsh
        run: |
          # 公式fpcalc 1.6.1のpackage/build.shが固定しているChromaprint/FFmpeg/ビルドスクリプトを
          # バイナリと同じReleaseから取得できるようにする。これにより上流URLの存続だけに依存しない。
          $chromaprintSource = "artifacts/chromaprint-$env:CHROMAPRINT_VERSION.tar.gz"
          Invoke-WebRequest -Uri "https://github.com/acoustid/chromaprint/releases/download/v$env:CHROMAPRINT_VERSION/chromaprint-$env:CHROMAPRINT_VERSION.tar.gz" -OutFile $chromaprintSource

          $ffmpegSource = "artifacts/ffmpeg-$env:FFMPEG_VERSION.tar.xz"
          Invoke-WebRequest -Uri "https://ffmpeg.org/releases/ffmpeg-$env:FFMPEG_VERSION.tar.xz" -OutFile $ffmpegSource

          $ffmpegBuildSource = "artifacts/ffmpeg-build-$env:FFMPEG_BUILD_TAG.tar.gz"
          Invoke-WebRequest -Uri "https://github.com/acoustid/ffmpeg-build/archive/refs/tags/$env:FFMPEG_BUILD_TAG.tar.gz" -OutFile $ffmpegBuildSource

          "CHROMAPRINT_SOURCE=$chromaprintSource" >> $env:GITHUB_ENV
          "FFMPEG_SOURCE=$ffmpegSource" >> $env:GITHUB_ENV
          "FFMPEG_BUILD_SOURCE=$ffmpegBuildSource" >> $env:GITHUB_ENV

      - name: Create release archive
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $archive = "TrackMatch-$tag-win-x64.zip"
          Compress-Archive -Path artifacts/package/* -DestinationPath "artifacts/$archive" -CompressionLevel Optimal
          "RELEASE_ARCHIVE=artifacts/$archive" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            $env:RELEASE_ARCHIVE `
            $env:CHROMAPRINT_SOURCE `
            $env:FFMPEG_SOURCE `
            $env:FFMPEG_BUILD_SOURCE `
            --generate-notes `
            --title 'TrackMatch ${{ github.ref_name }}'
